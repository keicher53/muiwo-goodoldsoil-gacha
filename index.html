<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>梅窩好老土 · 爽皮啤酒抽卡</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== 開場頁 ===== -->
  <section id="intro-screen" class="screen intro-screen">
    <div class="intro-card">
      <div class="intro-card-inner">
        <span class="intro-tag">電子收藏卡</span>
        <h1 class="intro-title">梅窩好老土</h1>
        <p class="intro-sub">爽皮啤酒 · 抽卡體驗</p>

        <div class="intro-emojis">😄 😠 🥹 😋</div>

        <p class="intro-desc">
          <span class="desc-line">一口老土，一份爽皮。</span>
          <span class="desc-line">抽一張，屬於你嘅梅窩風味。</span>
          <span class="desc-note">每人限抽一張 · 儲存落電話留念</span>
        </p>

        <button id="start-btn" class="start-btn">開始抽卡</button>
        <button id="collection-btn" class="collection-btn">我的收藏</button>

        <a href="https://goodoldsoil.hk/" target="_blank" rel="noopener noreferrer" class="learn-more">
          了解更多好老土 →
        </a>
      </div>
    </div>
  </section>

  <!-- ===== 抽卡頁 ===== -->
  <section id="gacha-screen" class="screen gacha-screen hidden">
    <main class="container">
      <header class="brand">
        <h1>梅窩好老土</h1>
        <p class="subtitle">一口老土，一份爽皮</p>
      </header>

      <div id="card-area">
        <div class="card card-back">
          <div class="card-back-inner">
            <span class="logo">好老土</span>
            <span class="hint-text">爽皮啤酒</span>
          </div>
        </div>
      </div>

      <button id="draw-btn">抽卡</button>
      <!-- 按鈕字眼已改做「下載卡片」 -->
      <button id="save-btn" hidden>下載卡片</button>
      <p id="hint" class="hint"></p>

      <footer class="footer">
        <p>每人限抽一張 · 支持梅窩本地釀造</p>
        <a href="https://goodoldsoil.hk/" target="_blank" rel="noopener noreferrer" class="learn-more small">
          了解更多好老土 →
        </a>
      </footer>
    </main>
  </section>

  <!-- ===== 收藏頁：電子展示櫃 ===== -->
  <section id="collection-screen" class="screen collection-screen hidden">
    <main class="container">
      <header class="brand">
        <h1>我的收藏</h1>
        <p class="subtitle">上傳相片，放入你嘅展示櫃</p>
      </header>

      <div id="display-case" class="display-case">
        <!-- 由 JS 注入格子 -->
      </div>

      <button id="back-btn" class="back-btn">返回</button>
    </main>
  </section>

  <input type="file" id="upload-input" accept="image/*" hidden />

  <script src="script.js"></script>
</body>
</html>
